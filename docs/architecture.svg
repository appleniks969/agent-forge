<svg width="100%" viewBox="0 0 900 372" role="img" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>forge architecture</title>
<desc>A pure kernel decides effects and events from each input; an async driver executes the effects against adapters (Anthropic, tools, MCP); every durable event is appended to one fsync'd log that is the only source of truth, so fold(log) equals live state and resume is replay.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9 Z" fill="#6B6A64"/></marker></defs>
<rect x="2" y="2" width="896" height="368" rx="16" fill="#FBFBF8" stroke="#E4E3DC"/>
<text x="40" y="50" font-size="30" font-weight="600" fill="#26215C">forge</text>
<text x="118" y="50" font-size="15" fill="#6B6A64">a sans-IO coding agent</text>
<text x="40" y="76" font-size="14" fill="#88877F">a pure kernel over one append-only event log</text>
<rect x="40" y="108" width="250" height="92" rx="9" fill="#EEEDFE" stroke="#534AB7"/>
<text x="56" y="134" font-size="15" font-weight="600" fill="#3C3489">kernel — pure</text>
<text x="56" y="158" font-size="12.5" fill="#534AB7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">step(state, input)</text>
<text x="56" y="176" font-size="12.5" fill="#534AB7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  &#8594; effects, events</text>
<rect x="338" y="108" width="206" height="92" rx="9" fill="#F1EFE8" stroke="#888780"/>
<text x="354" y="134" font-size="15" font-weight="600" fill="#2C2C2A">driver — async</text>
<text x="354" y="158" font-size="12.5" fill="#5F5E5A">executes effects;</text>
<text x="354" y="176" font-size="12.5" fill="#5F5E5A">streams, never blocks</text>
<rect x="592" y="108" width="266" height="92" rx="9" fill="#F1EFE8" stroke="#888780"/>
<text x="608" y="134" font-size="15" font-weight="600" fill="#2C2C2A">adapters</text>
<text x="608" y="158" font-size="12.5" fill="#5F5E5A">Anthropic &#183; tools &#183; MCP</text>
<text x="608" y="176" font-size="12.5" fill="#5F5E5A">all I/O quarantined here</text>
<line x1="290" y1="154" x2="334" y2="154" stroke="#7F77DD" stroke-width="1.6" marker-end="url(#ah)"/>
<line x1="544" y1="154" x2="588" y2="154" stroke="#888780" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 725 200 L 725 224 L 165 224 L 165 204" fill="none" stroke="#9b9a92" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="445" y="220" font-size="11.5" fill="#88877F" text-anchor="middle">model output &#183; tool results re-enter</text>
<rect x="40" y="250" width="818" height="86" rx="9" fill="#E1F5EE" stroke="#0F6E56"/>
<text x="58" y="280" font-size="15" font-weight="600" fill="#085041">event log — append-only, fsync'd</text>
<text x="58" y="305" font-size="13" fill="#0F6E56">the only source of truth &#183; every durable event lands here before anything sees it</text>
<text x="58" y="325" font-size="13" fill="#0F6E56" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">fold(log) == live  &#183;  resume = replay  &#183;  audit by construction</text>
<line x1="120" y1="200" x2="120" y2="246" stroke="#1D9E75" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="132" y="240" font-size="11.5" fill="#0F6E56">events</text>
</svg>
