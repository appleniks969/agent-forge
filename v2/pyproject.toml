[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge-v2"
version = "0.1.0"
description = "forge v2 - a sans-IO coding agent: pure kernel over one event log"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp"]

[project.scripts]
forge = "forge.front.wiring:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "import-linter",
    "anthropic",
]

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
