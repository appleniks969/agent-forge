[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge"
version = "0.1.0"
description = "A sans-IO coding agent: a pure kernel over one append-only event log"
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40", "rich>=13", "prompt_toolkit>=3"]

[project.optional-dependencies]
mcp = ["mcp"]

[project.scripts]
forge = "forge.front.wiring:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "import-linter",
]

[tool.hatch.build.targets.wheel]
packages = ["forge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
